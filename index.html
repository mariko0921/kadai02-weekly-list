<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やると決めたら『やる!』リスト</title>

        <!-- CSSの読み込み -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
     <!-- ① タイトル -->
    <header>
    <h1>
        やると決めたら<br>
        <span>「やる！」</span>リスト✨
    </h1>
    <p>WEEKLY CHALLENGE TO DAILY ROUTINE</p>
    </header>

    <main>

        <!-- 切り替えタブ（Todoリスト／習慣化） -->
        <nav class="tab-bar">
            <button type="button" data-tab="all" class="tab-active">📋 Todoリスト</button>
            <button type="button" data-tab="habit">🔥 習慣化</button>
        </nav>

        <!-- ② 今日の達成率 -->
        <section id="progress">
            <!-- 全体の達成率 -->
            <div class="progress-circle" id="all-circle">
                <div class="progress-inner">
                    <h2>今日の達成率</h2>
                    <p id="today-rate">0%</p>
                    <p id="today-count">0 / 0 完了</p>
                </div>
            </div>

            <!-- 🔥 習慣化の達成率（習慣化タブのときだけ表示） -->
            <div class="progress-circle" id="habit-circle">
                <div class="progress-inner">
                    <h2>🔥 習慣化の達成率</h2>
                    <p id="habit-rate">0%</p>
                    <p id="habit-count">0 / 0 完了</p>
                </div>
            </div>
        </section>

        <!-- ③ 曜日 -->
        <section id="week">
    <h2>今週の進み具合</h2>

    <p id="weekly-rate">0%</p>

    <div class="weekly-bar">
        <div id="weekly-bar-fill"></div>
    </div>

    <div class="week-days">
        <button type="button">月</button>
        <button type="button">火</button>
        <button type="button">水</button>
        <button type="button">木</button>
        <button type="button">金</button>
        <button type="button">土</button>
        <button type="button">日</button>
    </div>
</section>

        <!-- 🔥 習慣化チャレンジ（習慣化タブのときだけ表示） -->
        <section id="habit-list">
            <h2>🔥 習慣化チャレンジ</h2>

            <ul></ul>

            <p class="habit-empty">
                🔥がついた項目はまだありません。<br>
                「📋 すべて」タブで🔥を押して、習慣化をはじめよう！
            </p>
        </section>

        <!-- ④ 家事 -->
        <section id="housework">
    <h2>🏠 家事</h2>

    <ul></ul>

    <button>＋ 項目を追加</button>
        </section>

        <!-- ⑤ プログラミング -->
        <section id="programming">
            <h2>💻 プログラミング</h2>

            <ul></ul>

            <button>＋ 項目を追加</button>
        </section>

        <!-- ⑥ 勉強 -->
        <section id="study">
            <h2>📚 勉強</h2>

            <ul></ul>

            <button>＋ 項目を追加</button>
        </section>

        <!-- ⑦ 健康 -->
        <section id="health">
            <h2>❤️ 健康管理</h2>

            <ul></ul>

            <button>＋ 項目を追加</button>
        </section>

    </main>

    <!-- 21日達成のお祝い（達成したときだけ表示） -->
    <div id="celebration" class="celebration">
        <div class="confetti"></div>

        <div class="celebration-card" role="dialog" aria-modal="true" aria-labelledby="celebration-title">
            <p class="celebration-icon">🎉 🏆 🎉</p>
            <h2 id="celebration-title"></h2>
            <p id="celebration-message"></p>
            <button type="button" id="celebration-close">閉じる</button>
        </div>
    </div>

<!-- jQueryを読み込む -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- 自分のJavaScript -->
<script src="js/script.js"></script>
</body>
</html>
